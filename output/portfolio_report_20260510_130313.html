<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS Strategy - Portfolio Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f111a;
            --surface-color: rgba(25, 28, 41, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8f9fa;
            --text-secondary: #a0aabf;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --positive: #10b981;
            --negative: #ef4444;
            --positive-bg: rgba(16, 185, 129, 0.1);
            --negative-bg: rgba(239, 68, 68, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(135deg, #fff, #a0aabf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--accent-primary) inset;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .symbol-container {
            display: flex;
            flex-direction: column;
        }

        .symbol {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: var(--text-primary);
            transition: color 0.2s;
        }
        
        .symbol:hover {
            color: var(--accent-primary);
        }

        .mcap-rank {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            width: fit-content;
        }

        .tv-link {
            font-size: 0.8rem;
            background: #2962ff;
            color: white;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .tv-link:hover {
            background: #1e4bd8;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .positive { color: var(--positive); }
        .negative { color: var(--negative); }

        .sparkline-container {
            height: 60px;
            width: 100%;
            margin-top: auto;
            position: relative;
        }

        .sparkline {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        
        .sparkline-path {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .sparkline-fill {
            stroke: none;
        }
    </style>

        let mcapAsc = true;

        const grid = document.getElementById('cardGrid');

        function formatPct(val) {
            const prefix = val > 0 ? '+' : '';
            return `<span class="${val >= 0 ? 'positive' : 'negative'}">${prefix}${val.toFixed(2)}%</span>`;
        }

        function createSparkline(data, isPositive) {
            if (!data || data.length < 2) return '';
            
            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min || 1;
            
            const width = 300;
            const height = 60;
            
            const points = data.map((val, i) => {
                const x = (i / (data.length - 1)) * width;
                const y = height - ((val - min) / range) * height;
                return `${x},${y}`;
            }).join(' ');

            const color = isPositive ? '#10b981' : '#ef4444';
            const gradientId = `grad-${Math.random().toString(36).substr(2, 9)}`;

            return `
                <svg class="sparkline" viewBox="0 -5 300 70" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="${gradientId}" x1="0" x2="0" y1="0" y2="1">
                            <stop offset="0%" stop-color="${color}" stop-opacity="0.2"/>
                            <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                    <polygon class="sparkline-fill" points="0,60 ${points} 300,60" fill="url(#${gradientId})"/>
                    <polyline class="sparkline-path" points="${points}" stroke="${color}"/>
                </svg>
            `;
        }

        function renderCards(data) {
            grid.innerHTML = data.map(asset => `
                <div class="card">

                        <div class="symbol-container">
                            <a href="${asset.tradingview_url}" target="_blank" class="symbol">${asset.symbol}</a>
                            <span class="mcap-rank">Rank #${asset.mcap_rank}</span>
                        </div>
                        <a href="${asset.tradingview_url}" target="_blank" class="tv-link">Chart ↗</a>
                    </div>
                    
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Total Return</span>
                            <span class="metric-value">${formatPct(asset.total_return)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Win Rate</span>
                            <span class="metric-value">${asset.win_rate.toFixed(1)}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Max Drawdown</span>
                            <span class="metric-value">${asset.max_dd.toFixed(2)}%</span>
                        </div>
                        <div class="metric">

                            <span class="metric-value">${asset.trades}</span>
                        </div>
                    </div>

                    <div class="sparkline-container">
                        ${createSparkline(asset.sparkline, asset.total_return >= 0)}
                    </div>
                </div>
            `).join('');
        }
